<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#555" stroke-width="1.4"/>
    </marker>
    <style>
      .title { font-size: 14px; font-weight: bold; fill: #111; }
      .sub   { font-size: 11.5px; fill: #333; }
      .note  { font-size: 11px; fill: #666; font-style: italic; }
      .mm    { fill: #e6edfb; stroke: #3b5ba9; stroke-width: 1.5; }
      .mmext { fill: #ececec; stroke: #777; stroke-width: 1.5; }
      .mdl   { fill: #fff4d6; stroke: #b8860b; stroke-width: 1.5; }
      .aux   { fill: #ffffff; stroke: #888; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .tlab  { font-size: 12px; font-weight: bold; fill: #111; }
      .conf  { stroke: #555; stroke-width: 1.3; stroke-dasharray: 6 4; fill: none; }
      .flow  { stroke: #333; stroke-width: 2; fill: none; }
      .data  { stroke: #777; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
      .tick  { stroke: #c9a227; stroke-width: 1.2; fill: none; }
      .lvl   { font-size: 16px; font-weight: bold; fill: #222; }
      .lvls  { font-size: 11px; fill: #555; }
      .pill  { fill: #ffe58a; stroke: #c9a227; stroke-width: 1; }
      .file  { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 11px; font-weight: bold; fill: #4a3500; }
      .pillx { fill: #e4e4e4; stroke: #999; stroke-width: 1; }
      .filex { font-size: 11px; font-style: italic; fill: #444; }
    </style>
  </defs>

  <rect x="0" y="0" width="1170" height="640" fill="#ffffff"/>

  <!-- Level bands -->
  <rect x="10" y="38" width="1150" height="120" rx="6" fill="#f4f6fb"/>
  <rect x="10" y="268" width="1150" height="94" rx="6" fill="#fbf8ef"/>
  <text class="lvl" x="22" y="92">M2</text>
  <text class="lvls" x="22" y="109">Metamodels</text>
  <text class="lvl" x="22" y="312">M1</text>
  <text class="lvls" x="22" y="329">Models</text>

  <!-- M2: metamodels -->
  <rect class="mm" x="130" y="50" width="200" height="96" rx="5"/>
  <text class="title" x="230" y="70" text-anchor="middle">Problem DSL</text>
  <text class="sub" x="230" y="86" text-anchor="middle">describes a Sudoku puzzle</text>
  <rect class="pill" x="177" y="96" width="106" height="18" rx="9"/>
  <text class="file" x="230" y="109" text-anchor="middle">problem_dsl.py</text>
  <rect class="pill" x="155" y="118" width="150" height="18" rx="9"/>
  <text class="file" x="230" y="131" text-anchor="middle">problem_validator.py</text>

  <rect class="mm" x="400" y="50" width="200" height="96" rx="5"/>
  <text class="title" x="500" y="70" text-anchor="middle">Solution DSL (CNF)</text>
  <text class="sub" x="500" y="86" text-anchor="middle">describes a SAT formula</text>
  <rect class="pill" x="443" y="96" width="114" height="18" rx="9"/>
  <text class="file" x="500" y="109" text-anchor="middle">solution_dsl.py</text>
  <rect class="pill" x="421" y="118" width="158" height="18" rx="9"/>
  <text class="file" x="500" y="131" text-anchor="middle">solution_validator.py</text>

  <rect class="mmext" x="670" y="50" width="200" height="96" rx="5"/>
  <text class="title" x="770" y="82" text-anchor="middle">Quantum circuit MM</text>
  <text class="sub" x="770" y="99" text-anchor="middle">describes quantum circuits</text>
  <text class="note" x="770" y="117" text-anchor="middle">BESSER (existing)</text>

  <rect class="mmext" x="940" y="50" width="200" height="96" rx="5"/>
  <text class="title" x="1040" y="82" text-anchor="middle">Python + Qiskit</text>
  <text class="sub" x="1040" y="99" text-anchor="middle">the target language</text>
  <text class="note" x="1040" y="117" text-anchor="middle">(existing)</text>

  <!-- conformsTo -->
  <path class="conf" d="M230,288 L230,148" marker-end="url(#open)"/>
  <path class="conf" d="M500,288 L500,148" marker-end="url(#open)"/>
  <path class="conf" d="M770,288 L770,148" marker-end="url(#open)"/>
  <path class="conf" d="M1040,288 L1040,148" marker-end="url(#open)"/>
  <text class="note" x="238" y="200">«conformsTo»</text>
  <text class="note" x="508" y="200">«conformsTo»</text>
  <text class="note" x="778" y="200">«conformsTo»</text>
  <text class="note" x="1048" y="200">«conformsTo»</text>

  <!-- M1: models -->
  <rect class="mdl" x="130" y="288" width="200" height="54" rx="5"/>
  <text class="title" x="230" y="310" text-anchor="middle">Sudoku puzzle</text>
  <text class="sub" x="230" y="328" text-anchor="middle">one puzzle to solve</text>

  <rect class="mdl" x="400" y="288" width="200" height="54" rx="5"/>
  <text class="title" x="500" y="310" text-anchor="middle">CNF formula</text>
  <text class="sub" x="500" y="328" text-anchor="middle">the puzzle as clauses</text>

  <rect class="mdl" x="670" y="288" width="200" height="54" rx="5"/>
  <text class="title" x="770" y="310" text-anchor="middle">Grover circuit</text>
  <text class="sub" x="770" y="328" text-anchor="middle">searches for a solution</text>

  <rect class="mdl" x="940" y="288" width="200" height="54" rx="5"/>
  <text class="title" x="1040" y="310" text-anchor="middle">qiskit_circuit.py</text>
  <text class="sub" x="1040" y="328" text-anchor="middle">runnable Qiskit script</text>

  <!-- Transformations, with their implementing files above -->
  <rect class="pill" x="283" y="226" width="164" height="18" rx="9"/>
  <text class="file" x="365" y="239" text-anchor="middle">t1_problem2solution.py</text>
  <path class="tick" d="M365,244 L365,290"/>
  <path class="flow" d="M330,315 L398,315" marker-end="url(#solid)"/>
  <text class="tlab" x="365" y="304" text-anchor="middle">T1 · M2M</text>

  <rect class="pill" x="553" y="226" width="164" height="18" rx="9"/>
  <text class="file" x="635" y="239" text-anchor="middle">t2_solution_quantum.py</text>
  <path class="tick" d="M635,244 L635,290"/>
  <path class="flow" d="M600,315 L668,315" marker-end="url(#solid)"/>
  <text class="tlab" x="635" y="304" text-anchor="middle">T2 · M2M</text>

  <rect class="pillx" x="825" y="226" width="160" height="18" rx="9"/>
  <text class="filex" x="905" y="239" text-anchor="middle">BESSER QiskitGenerator</text>
  <path class="tick" d="M905,244 L905,290" style="stroke:#999"/>
  <path class="flow" d="M870,315 L938,315" marker-end="url(#solid)"/>
  <text class="tlab" x="905" y="304" text-anchor="middle">T3 · M2T</text>

  <!-- Extra input / output of the transformations -->
  <rect class="aux" x="290" y="400" width="150" height="44" rx="5"/>
  <text class="title" x="365" y="419" text-anchor="middle">T1Trace</text>
  <text class="sub" x="365" y="435" text-anchor="middle">links cells to variables</text>
  <path class="data" d="M365,319 L365,398" marker-end="url(#open)"/>

  <rect class="aux" x="660" y="400" width="220" height="66" rx="5"/>
  <text class="title" x="770" y="418" text-anchor="middle">SolverConfig</text>
  <text class="sub" x="770" y="434" text-anchor="middle">solver parameters</text>
  <rect class="pill" x="708" y="442" width="124" height="18" rx="9"/>
  <text class="file" x="770" y="455" text-anchor="middle">solver_config.py</text>
  <path class="data" d="M690,400 L640,321" marker-end="url(#open)"/>
  <path class="data" d="M850,400 L900,321" marker-end="url(#open)"/>

  <!-- Execution -->
  <rect class="aux" x="940" y="400" width="200" height="44" rx="5"/>
  <text class="title" x="1040" y="419" text-anchor="middle">Run on Aer</text>
  <text class="sub" x="1040" y="435" text-anchor="middle">simulates, returns counts</text>
  <path class="flow" d="M1040,342 L1040,398" marker-end="url(#solid)"/>

  <!-- Inputs the workflow collects to decode and compare -->
  <path class="data" d="M365,444 L365,508" marker-end="url(#open)"/>
  <text class="note" x="373" y="482">trace</text>
  <path class="data" d="M1040,444 L1040,508" marker-end="url(#open)"/>
  <text class="note" x="1048" y="482">counts</text>

  <!-- Workflow -->
  <rect x="130" y="510" width="1010" height="78" rx="6" fill="#08427b" stroke="#052e56" stroke-width="1.5"/>
  <text x="635" y="531" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Workflow</text>
  <rect class="pill" x="503" y="539" width="92" height="18" rx="9"/>
  <text class="file" x="549" y="552" text-anchor="middle">pipeline.py</text>
  <rect class="pill" x="607" y="539" width="160" height="18" rx="9"/>
  <text class="file" x="687" y="552" text-anchor="middle">classical_baseline.py</text>
  <text x="635" y="576" text-anchor="middle" font-size="11.5" fill="#dfe8f5">for each puzzle: build problem model → run T1 → T2 → T3 → Aer → decode with T1Trace → compare with classical baseline</text>
  <path class="data" d="M770,510 L770,468" marker-end="url(#open)"/>
  <text class="note" x="778" y="502">M from classical baseline</text>
  <text class="lvl" x="22" y="545">Run</text>
  <text class="lvls" x="22" y="562">Workflow</text>

  <!-- Legend -->
  <rect class="pill" x="22" y="608" width="60" height="16" rx="8"/>
  <text class="file" x="52" y="620" text-anchor="middle">file.py</text>
  <text class="lvls" x="90" y="620">= our Python file · solid arrow = transformation / execution · dashed arrow = «conformsTo» or extra input/output · blue = our metamodels · grey = existing (BESSER, Qiskit)</text>
</svg>
